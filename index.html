<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f4f1;
  --surface:#ffffff;
  --ink:#16181a;
  --muted:#6b7177;
  --line:#e1e3de;
  --accent:#1f5eff;
  --accent-ink:#ffffff;
  --ok:#17803d;
  --warn:#b45309;
  --danger:#c62828;
  --radius:14px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#101214;
    --surface:#181b1e;
    --ink:#eceef0;
    --muted:#8d949b;
    --line:#272b2f;
    --accent:#5b8cff;
    --accent-ink:#0b0d10;
    --ok:#4ade80;
    --warn:#fbbf24;
    --danger:#f87171;
  }
}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--ink);
  font-family:'Figtree',system-ui,sans-serif;font-size:15px;line-height:1.5;
  min-height:100vh;
}
h1,h2,h3,.display{font-family:'Bricolage Grotesque','Figtree',sans-serif;letter-spacing:-.02em}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.wrap{max-width:1120px;margin:0 auto;padding:0 20px}

header.top{
  position:sticky;top:0;z-index:10;
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.top-in{display:flex;align-items:center;justify-content:space-between;height:60px}
.brand{font-size:22px;font-weight:700}
.btn{
  border:1px solid var(--line);background:var(--surface);
  padding:8px 14px;border-radius:10px;font-weight:500;
  transition:border-color .15s,background .15s;
}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger)}
.btn.danger:hover{border-color:var(--danger)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}

.adminbar{
  display:none;gap:10px;flex-wrap:wrap;align-items:center;
  padding:14px 0 0;
}
body.is-admin .adminbar{display:flex}
.adminbar .tag{font-size:13px;color:var(--muted);margin-right:auto}

.tabs{
  display:flex;gap:8px;overflow-x:auto;padding:18px 0 6px;
  scrollbar-width:none;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  display:inline-flex;align-items:center;gap:8px;flex:none;
  border:1px solid var(--line);background:var(--surface);
  padding:8px 16px;border-radius:999px;font-weight:500;white-space:nowrap;
}
.tab[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.tab .x{
  display:none;border:0;background:transparent;padding:0 0 0 2px;
  font-size:16px;line-height:1;opacity:.6;
}
.tab .x:hover{opacity:1}
body.is-admin .tab:not([data-id="all"]) .x{display:inline}

main{padding:18px 0 80px}
.grid{
  display:grid;gap:16px;
  grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
}
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;display:flex;flex-direction:column;
}
.card img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--line)}
.card .body{padding:16px;display:flex;flex-direction:column;gap:10px;flex:1}
.path{font-size:13px;color:var(--muted)}
.card h3{font-size:19px;font-weight:600;line-height:1.25}
.row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:auto}
.price{font-family:'Bricolage Grotesque',sans-serif;font-size:22px;font-weight:700;letter-spacing:-.02em}
.stock{font-size:13px;font-weight:500;color:var(--ok)}
.stock.low{color:var(--warn)}
.stock.out{color:var(--danger)}
.buy{
  display:block;text-align:center;text-decoration:none;
  background:var(--accent);color:var(--accent-ink);
  padding:11px;border-radius:10px;font-weight:600;
}
.buy:hover{filter:brightness(1.08)}
.buy.off{background:var(--line);color:var(--muted);pointer-events:none}

.admin-row{
  display:none;gap:6px;align-items:center;flex-wrap:wrap;
  padding-top:12px;border-top:1px dashed var(--line);
}
body.is-admin .admin-row{display:flex}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.stepper button{border:0;background:transparent;width:30px;height:30px;font-size:16px}
.stepper button:hover{background:var(--line)}
.stepper span{min-width:30px;text-align:center;font-weight:600;font-size:14px}
.admin-row .spacer{margin-left:auto;display:flex;gap:6px}

.empty{
  grid-column:1/-1;text-align:center;padding:70px 20px;color:var(--muted);
  border:1px dashed var(--line);border-radius:var(--radius);
}
.empty h2{color:var(--ink);font-size:22px;margin-bottom:6px}

dialog{
  border:1px solid var(--line);border-radius:18px;background:var(--surface);color:var(--ink);
  padding:0;width:min(440px,calc(100vw - 28px));
  box-shadow:0 24px 60px rgba(0,0,0,.28);
}
dialog::backdrop{background:rgba(10,12,14,.55);backdrop-filter:blur(2px)}
dialog form{padding:22px;display:flex;flex-direction:column;gap:14px;max-height:88vh;overflow:auto}
dialog h2{font-size:22px}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:500;color:var(--muted)}
input,select{
  background:var(--bg);border:1px solid var(--line);border-radius:10px;
  padding:10px 12px;color:var(--ink);width:100%;
}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:4px}
.err{color:var(--danger);font-size:13px;min-height:18px}
.preview{width:100%;max-height:160px;object-fit:cover;border-radius:10px;display:none}
.check{flex-direction:row;align-items:center;gap:8px}
.check input{width:auto}

.corner{
  position:fixed;right:0;bottom:0;width:44px;height:44px;z-index:5;
  background:none;border:0;opacity:.5;display:grid;place-items:center;
}
.corner::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}

.toast{
  position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;
  font-weight:500;opacity:0;pointer-events:none;transition:.2s;z-index:50;
}
.toast.show{opacity:1;transform:translateX(-50%)}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="wrap top-in">
    <h1 class="brand">Store</h1>
  </div>
</header>

<div class="wrap">
  <div class="adminbar">
    <span class="tag">Admin mode</span>
    <button class="btn sm" id="newTabBtn">New tab</button>
    <button class="btn sm primary" id="newItemBtn">Add item</button>
    <button class="btn sm" id="logoutBtn">Log out</button>
  </div>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <main><div class="grid" id="grid"></div></main>
</div>
<button class="corner" id="adminBtn" aria-label="Admin"></button>

<dialog id="loginDlg">
  <form method="dialog" id="loginForm">
    <h2>Admin login</h2>
    <label>Admin code<input type="password" id="codeIn" inputmode="numeric" autocomplete="off"></label>
    <div class="err" id="loginErr"></div>
    <div class="actions">
      <button type="button" class="btn" data-close>Cancel</button>
      <button type="submit" class="btn primary">Log in</button>
    </div>
  </form>
</dialog>

<dialog id="tabDlg">
  <form method="dialog" id="tabForm">
    <h2>New tab</h2>
    <label>Tab name<input id="tabName" maxlength="30" required placeholder="Fruit"></label>
    <div class="actions">
      <button type="button" class="btn" data-close>Cancel</button>
      <button type="submit" class="btn primary">Create tab</button>
    </div>
  </form>
</dialog>

<dialog id="itemDlg">
  <form method="dialog" id="itemForm">
    <h2 id="itemDlgTitle">Add item</h2>
    <label>Tab<select id="fTab" required></select></label>
    <label>Title<input id="fTitle" maxlength="80" required placeholder="Apple"></label>
    <div class="two">
      <label>Price<input id="fPrice" type="number" min="0" step="any" required placeholder="15000"></label>
      <label>Stock<input id="fStock" type="number" min="0" step="1" required placeholder="10"></label>
    </div>
    <label>WhatsApp number or link<input id="fWa" required placeholder="628123456789 or https://wa.me/..."></label>
    <label>Photo (optional)<input id="fPhoto" type="file" accept="image/*"></label>
    <img class="preview" id="fPreview" alt="">
    <label class="check" id="rmWrap" style="display:none"><input type="checkbox" id="fRemove">Remove current photo</label>
    <div class="err" id="itemErr"></div>
    <div class="actions">
      <button type="button" class="btn" data-close>Cancel</button>
      <button type="submit" class="btn primary" id="itemSave">Save item</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, push, set, update, onValue, increment } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDfz-OQyfbNiNel4l4V1IdGjM4BcM2IdtE",
  authDomain: "store-35229.firebaseapp.com",
  databaseURL: "https://store-35229-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "store-35229",
  storageBucket: "store-35229.firebasestorage.app",
  messagingSenderId: "268485910353",
  appId: "1:268485910353:web:3b8de396ce3821e39fbd70",
  measurementId: "G-SB6D51HQK8"
};

const db = getDatabase(initializeApp(firebaseConfig));
const ADMIN_CODE = "9831";

const $ = id => document.getElementById(id);
const state = { tabs:{}, items:{}, active:"all", editing:null };

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(n);

function toast(msg){
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(()=>t.classList.remove("show"), 2200);
}

/* ---------- admin session ---------- */
function setAdmin(on){
  document.body.classList.toggle("is-admin", on);
  $("adminBtn").style.display = on ? "none" : "";
  if(on) sessionStorage.setItem("adm","1"); else sessionStorage.removeItem("adm");
}
const fail = e => toast(/permission/i.test(e?.code+" "+e?.message) ? "Permission denied. Update Firebase rules." : "Save failed. Try again.");
const isAdmin = () => document.body.classList.contains("is-admin");
if(sessionStorage.getItem("adm")==="1") setAdmin(true);

$("logoutBtn").onclick = () => { setAdmin(false); toast("Logged out"); };
$("adminBtn").onclick = () => {
  $("codeIn").value = ""; $("loginErr").textContent = "";
  $("loginDlg").showModal(); $("codeIn").focus();
};
$("loginForm").onsubmit = e => {
  if($("codeIn").value !== ADMIN_CODE){
    e.preventDefault(); $("loginErr").textContent = "Wrong code.";
    return;
  }
  setAdmin(true); toast("Admin mode on");
};

document.querySelectorAll("[data-close]").forEach(b => b.onclick = () => b.closest("dialog").close());

/* ---------- realtime data ---------- */
onValue(ref(db,"tabs"), s => { state.tabs = s.val() || {}; if(state.active!=="all" && !state.tabs[state.active]) state.active="all"; render(); });
onValue(ref(db,"items"), s => { state.items = s.val() || {}; render(); });

/* ---------- render ---------- */
function render(){
  const tabEntries = Object.entries(state.tabs).sort((a,b)=>(a[1].createdAt||0)-(b[1].createdAt||0));

  $("tabs").innerHTML =
    `<button class="tab" role="tab" data-id="all" aria-selected="${state.active==="all"}">All</button>` +
    tabEntries.map(([id,t]) =>
      `<button class="tab" role="tab" data-id="${id}" aria-selected="${state.active===id}">${esc(t.name)}<span class="x" data-del="${id}" title="Delete tab">&times;</span></button>`
    ).join("");

  const list = Object.entries(state.items)
    .filter(([,i]) => state.active==="all" || i.tab===state.active)
    .sort((a,b)=>(b[1].createdAt||0)-(a[1].createdAt||0));

  if(!list.length){
    $("grid").innerHTML = `<div class="empty"><h2>Nothing here yet</h2><p>${isAdmin() ? "Add an item to get started." : "Check back soon."}</p></div>`;
    return;
  }

  $("grid").innerHTML = list.map(([id,i]) => {
    const tabName = state.tabs[i.tab]?.name || "Uncategorized";
    const stock = Number(i.stock)||0;
    const cls = stock===0 ? "out" : stock<=3 ? "low" : "";
    const label = stock===0 ? "Sold out" : stock<=3 ? `Only ${stock} left` : `${stock} in stock`;
    return `
    <article class="card">
      ${i.photo ? `<img src="${i.photo}" alt="${esc(i.title)}" loading="lazy">` : ""}
      <div class="body">
        <div class="path">${esc(tabName)} ➜ ${esc(i.title)}</div>
        <h3>${esc(i.title)}</h3>
        <div class="row">
          <span class="price">${money(i.price||0)}</span>
          <span class="stock ${cls}">${label}</span>
        </div>
        <a class="buy ${stock===0?"off":""}" href="${stock===0?"#":esc(waLink(i.wa,i.title))}" target="_blank" rel="noopener">Buy on WhatsApp</a>
        <div class="admin-row">
          <div class="stepper">
            <button data-dec="${id}" aria-label="Decrease stock">&minus;</button>
            <span>${stock}</span>
            <button data-inc="${id}" aria-label="Increase stock">+</button>
          </div>
          <div class="spacer">
            <button class="btn sm" data-edit="${id}">Edit</button>
            <button class="btn sm danger" data-rm="${id}">Delete</button>
          </div>
        </div>
      </div>
    </article>`;
  }).join("");
}

function waLink(raw, title){
  raw = String(raw||"").trim();
  const msg = encodeURIComponent(`Hi, I'm interested in ${title}`);
  if(/^https?:\/\//i.test(raw)){
    if(/wa\.me|whatsapp\.com/i.test(raw) && !/[?&]text=/.test(raw)) return raw + (raw.includes("?")?"&":"?") + "text=" + msg;
    return raw;
  }
  let d = raw.replace(/\D/g,"");
  if(d.startsWith("0")) d = "62" + d.slice(1);
  return `https://wa.me/${d}?text=${msg}`;
}

/* ---------- tabs ---------- */
$("tabs").onclick = e => {
  const del = e.target.closest("[data-del]");
  if(del){
    e.stopPropagation();
    const id = del.dataset.del, name = state.tabs[id]?.name;
    const ids = Object.entries(state.items).filter(([,i])=>i.tab===id).map(([k])=>k);
    if(!confirm(`Delete tab "${name}" and its ${ids.length} item(s)?`)) return;
    const patch = {[`tabs/${id}`]:null};
    ids.forEach(k => patch[`items/${k}`] = null);
    update(ref(db), patch).then(()=>toast("Tab deleted")).catch(fail);
    return;
  }
  const t = e.target.closest(".tab");
  if(t){ state.active = t.dataset.id; render(); }
};

$("newTabBtn").onclick = () => { $("tabName").value=""; $("tabDlg").showModal(); $("tabName").focus(); };
$("tabForm").onsubmit = () => {
  const name = $("tabName").value.trim();
  if(!name) return;
  const r = push(ref(db,"tabs"));
  set(r,{name,createdAt:Date.now()}).then(()=>{ state.active = r.key; render(); toast("Tab created"); }).catch(fail);
};

/* ---------- items ---------- */
let newPhoto = null;

function fillTabSelect(sel){
  const entries = Object.entries(state.tabs).sort((a,b)=>(a[1].createdAt||0)-(b[1].createdAt||0));
  $("fTab").innerHTML = entries.map(([id,t])=>`<option value="${id}">${esc(t.name)}</option>`).join("");
  $("fTab").value = sel && state.tabs[sel] ? sel : (state.active!=="all" ? state.active : entries[0][0]);
}

function openItem(id){
  if(!Object.keys(state.tabs).length){ toast("Create a tab first"); $("newTabBtn").click(); return; }
  state.editing = id || null; newPhoto = null;
  const i = id ? state.items[id] : null;
  $("itemDlgTitle").textContent = i ? "Edit item" : "Add item";
  fillTabSelect(i?.tab);
  $("fTitle").value = i?.title || "";
  $("fPrice").value = i?.price ?? "";
  $("fStock").value = i?.stock ?? "";
  $("fWa").value = i?.wa || "";
  $("fPhoto").value = "";
  $("fRemove").checked = false;
  $("rmWrap").style.display = i?.photo ? "flex" : "none";
  const pv = $("fPreview");
  if(i?.photo){ pv.src = i.photo; pv.style.display = "block"; } else { pv.removeAttribute("src"); pv.style.display = "none"; }
  $("itemErr").textContent = "";
  $("itemDlg").showModal();
}
$("newItemBtn").onclick = () => openItem();

$("fPhoto").onchange = async e => {
  const f = e.target.files[0];
  if(!f){ newPhoto = null; return; }
  try{
    newPhoto = await compress(f);
    $("fPreview").src = newPhoto; $("fPreview").style.display = "block";
  }catch{ $("itemErr").textContent = "Could not read that image."; newPhoto = null; }
};

async function compress(file){
  const bmp = await createImageBitmap(file);
  const max = 720, k = Math.min(1, max/Math.max(bmp.width,bmp.height));
  const c = document.createElement("canvas");
  c.width = Math.round(bmp.width*k); c.height = Math.round(bmp.height*k);
  c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
  return c.toDataURL("image/jpeg",.78);
}

$("itemForm").onsubmit = e => {
  const tab = $("fTab").value, title = $("fTitle").value.trim();
  const price = Number($("fPrice").value), stock = Math.max(0, Math.floor(Number($("fStock").value)));
  const wa = $("fWa").value.trim();
  if(!tab || !title || !wa || isNaN(price) || isNaN(stock)){ e.preventDefault(); $("itemErr").textContent = "Fill in every required field."; return; }

  const old = state.editing ? state.items[state.editing] : null;
  let photo = old?.photo || null;
  if($("fRemove").checked) photo = null;
  if(newPhoto) photo = newPhoto;

  const data = { tab, title, price, stock, wa, createdAt: old?.createdAt || Date.now() };
  if(photo) data.photo = photo;

  const r = state.editing ? ref(db,`items/${state.editing}`) : push(ref(db,"items"));
  set(r,data).then(()=>{ state.active = tab; render(); toast(state.editing ? "Item updated" : "Item added"); }).catch(fail);
};

$("grid").onclick = e => {
  const b = e.target.closest("button"); if(!b) return;
  const d = b.dataset;
  if(d.inc) update(ref(db,`items/${d.inc}`),{stock:increment(1)}).catch(fail);
  else if(d.dec){ if((state.items[d.dec]?.stock||0) > 0) update(ref(db,`items/${d.dec}`),{stock:increment(-1)}).catch(fail); }
  else if(d.edit) openItem(d.edit);
  else if(d.rm){
    if(confirm(`Delete "${state.items[d.rm]?.title}"?`)) set(ref(db,`items/${d.rm}`),null).then(()=>toast("Item deleted")).catch(fail);
  }
};

render();
</script>
</body>
</html>
